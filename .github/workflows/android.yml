name: Android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_ARGS: -Pkodiremote.versionCode=${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # The runner image ships an Android SDK with accepted licences; AGP downloads missing platforms itself.
      - uses: gradle/actions/setup-gradle@v6

      - name: Version name from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "VERSION_ARGS=$VERSION_ARGS -Pkodiremote.versionName=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # Optional release signing. Set these repository secrets to get a release APK signed with your own key:
      # ANDROID_KEYSTORE_BASE64 (base64 of the .jks), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
      - name: Release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
          else
            echo "No signing secrets: the release APK is signed with the runner's throwaway debug key."
          fi

      - name: Build
        run: ./gradlew --no-configuration-cache :app:assembleDebug :app:assembleRelease $VERSION_ARGS

      - name: Collect outputs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/kodi-remote-${{ github.run_number }}-debug.apk
          cp app/build/outputs/apk/release/*.apk dist/kodi-remote-${{ github.run_number }}-release.apk
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: kodi-remote-apk-${{ github.run_number }}
          path: dist/
          retention-days: 30

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: kodi-remote-apk-${{ github.run_number }}
          path: dist
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
